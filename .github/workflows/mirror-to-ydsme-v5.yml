name: Mirror to ydsme_v5's repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-neil
  cancel-in-progress: true

jobs:
  mirror:
    # Prevent the copied workflow from running inside ydsme_V5's repository.
    if: github.repository == 'nomenama/ydsme_v5'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.YDSME_V5_REPO_DEPLOY_KEY }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "::error::YDSME_V5_REPO_DEPLOY_KEY is not configured"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Copy main branch to ydsme_V5's repository
        run: |
          git push --force \
            git@github.com:webmasterYDSME/ydsme_v5.git \
            HEAD:main
